name: amir

services:
  db:
    image: postgres:16-alpine
    container_name: amir-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-amir}
      # AUDIT P2-14: no hard-coded production credential. Set this in the
      # deployment environment/secret store; Compose refuses to start without it.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in the deployment environment}
      POSTGRES_DB: ${POSTGRES_DB:-amir}
    # Local development only. The loopback binding prevents remote access even
    # when the host firewall is misconfigured. Remove this block in production.
    ports:
      - "127.0.0.1:5439:5432"
    volumes:
      - amir-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-amir} -d ${POSTGRES_DB:-amir}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - internal

  # AUDIT P2-14: one-shot migration job. Runs once, must succeed before the app
  # starts. Take/verify a backup before running this in production.
  migrate:
    image: ghcr.io/puplichost/amir:latest
    container_name: amir-migrate
    restart: "no"
    env_file: .env
    environment:
      DATABASE_URL: "postgresql://${POSTGRES_USER:-amir}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-amir}?schema=public"
      NODE_ENV: production
    command: ["npx", "prisma", "migrate", "deploy"]
    depends_on:
      db:
        condition: service_healthy
    networks:
      - internal

  app:
    image: ghcr.io/puplichost/amir:latest
    container_name: amir-app
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: "postgresql://${POSTGRES_USER:-amir}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-amir}?schema=public"
      NODE_ENV: development
      NITRO_PORT: "3000"
      NITRO_HOST: "0.0.0.0"
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
    volumes:
      - uploads-data:/app/public/uploads
      - app-storage:/app/storage
    networks:
      - internal
volumes:
  # Fresh data volume for the amir database. The previous volume
  # (me-project_pgdata, holding mango_electronics_db) is intentionally NOT
  # referenced here — it stays intact in Docker as a backup. Do not delete it.
  amir-pgdata:
  uploads-data:
  app-storage:

networks:
  internal:
  proxy:
    external: true
