name: amir

services:
  db:
    image: postgres:16-alpine
    container_name: amir-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: amir
      POSTGRES_PASSWORD: amir
      POSTGRES_DB: amir
    # Kept for local dev (`npm run dev` uses localhost:5439).
    # On the production server, firewall this port or delete these two lines.
    ports:
      - "5439:5432"
    volumes:
      - amir-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U amir -d amir"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - internal

  app:
    build: .
    container_name: amir-app
    restart: unless-stopped
    env_file: .env
    environment:
      # Overrides .env (which points at localhost for local dev).
      # Inside Compose the db is reachable by service hostname.
      DATABASE_URL: "postgresql://amir:amir@db:5432/amir?schema=public"
      NODE_ENV: production
      NITRO_PORT: "3000"
      NITRO_HOST: "0.0.0.0"
    expose:
      - "3000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - uploads-data:/app/public/uploads
      - app-storage:/app/storage
    networks:
      - internal
      - proxy

volumes:
  # Fresh data volume for the amir database. The previous volume
  # (me-project_pgdata, holding mango_electronics_db) is intentionally NOT
  # referenced here — it stays intact in Docker as a backup. Do not delete it.
  amir-pgdata:
  uploads-data:
  app-storage:

networks:
  internal:
  proxy:
    external: true
